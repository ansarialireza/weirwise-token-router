services:
  token-router:
    build: .
    container_name: weirwise-token-router
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      token-router-db:
        condition: service_healthy
    networks:
      - router-network

  token-router-db:
    image: postgres:16-alpine
    container_name: weirwise-token-router-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-token_router}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-token_router_db}
    volumes:
      - token_router_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-token_router} -d ${POSTGRES_DB:-token_router_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - router-network

volumes:
  token_router_data:

networks:
  router-network:
    driver: bridge
