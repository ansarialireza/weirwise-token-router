services:
  token-router:
    build: .
    container_name: weirwise-token-router
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - REDIS_URL=${REDIS_URL:-redis://token-router-redis:6379/0}
      - DISTRIBUTED_MODE=${DISTRIBUTED_MODE:-false}
      - QUOTA_FAILURE_POLICY=${QUOTA_FAILURE_POLICY:-local_fallback}
    depends_on:
      token-router-db:
        condition: service_healthy
      token-router-redis:
        condition: service_healthy
    networks:
      - router-network

  token-router-redis:
    image: redis:7-alpine
    container_name: weirwise-token-router-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "900 1 300 10 60 10000", "--maxmemory", "100mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - token_router_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - router-network

  token-router-db:
    image: postgres:16-alpine
    container_name: weirwise-token-router-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-token_router}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-token_router_db}
    volumes:
      - token_router_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-token_router} -d ${POSTGRES_DB:-token_router_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - router-network

volumes:
  token_router_data:
  token_router_redis_data:

networks:
  router-network:
    driver: bridge
