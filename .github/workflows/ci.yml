name: CI Quality & Reliability Verification

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-asyncio pytest-cov httpx cryptography

      - name: Run Pytest Suite
        env:
          ENVIRONMENT: test
          ADMIN_API_KEY: wtr_ci_admin_key_1234567890
          VAULT_MASTER_KEY: wtr_ci_vault_master_key_1234567890_32b
        run: |
          PYTHONPATH=. pytest tests -v
